buildscript {
  // These are FALLBACKS only: `getExtOrDefault` below prefers the consuming
  // app's `rootProject.ext` and reaches this map solely when the app does not
  // define the property. The standard React Native app template DOES define
  // `compileSdkVersion` (verified: @react-native-community/template's
  // `template/android/build.gradle` sets 35 at 0.77.3/0.78.3/0.79.7/0.80.3 and
  // 36 from 0.81.1 on), and `examples/bare-rn` sets 37 — so this value only
  // ever reaches a project that omitted it.
  //
  // WHY 35 AND NOT 36. `package.json` declares `react-native: ">=0.77.0"`, and
  // each RN release pins the Android Gradle Plugin its template resolves
  // (read out of `@react-native/gradle-plugin@<v>/gradle/libs.versions.toml`):
  // 0.77 -> AGP 8.7.2, 0.78 -> 8.8.0, 0.79 -> 8.8.2, 0.80 -> 8.9.2,
  // 0.81 -> 8.11.0, 0.82 -> 8.12.0, 0.87 -> 9.2.1. AGP 8.7.2's
  // `ToolsRevisionUtils.MAX_RECOMMENDED_COMPILE_SDK_VERSION` aliases
  // `SdkConstants.MAX_SUPPORTED_ANDROID_PLATFORM_VERSION`, which is API **35**
  // in the `com.android.tools:common:31.7.2` that AGP 8.7.2 ships with
  // (verified by reading the constant out of the published class file, not
  // inferred from release notes). A higher `compileSdkVersion` is reported by
  // AGP 8.7.2 as a WARNING, not an error — `SdkParsingUtilsKt
  // .warnIfCompileSdkTooNew` calls `IssueReporter.reportWarning` with
  // `COMPILE_SDK_VERSION_TOO_HIGH` — but it also requires the corresponding
  // `platforms;android-36` to be installed, which an SDK image provisioned for
  // an RN 0.77 project (template compileSdk 35) has no reason to carry. 35 is
  // the highest value that is both fully supported by the OLDEST AGP in range
  // and already required by every project in it.
  //
  // 35 is high enough at the other end too, checked against what is actually
  // consumed rather than assumed: the AAR metadata of `react-android` declares
  // `minCompileSdk=1` at 0.77.3/0.81.6/0.82.1 and `minCompileSdk=34` at
  // 0.87.1, and its androidx transitives at 0.87.1 (appcompat 1.7.0,
  // window 1.5.1, autofill 1.3.0) all declare `minCompileSdk=34`. This
  // library's own Kotlin needs nothing newer either — every `android.*` import
  // across `src/main/java/com/autoskeleton/` is API 21 or older
  // (`ComponentCallbacks2`, `Outline`, `Choreographer`, `android.os.Trace`,
  // `LinearGradient`, ...) against `minSdkVersion 24`. It also finally agrees
  // with the `targetSdkVersion 35` pinned below for Robolectric 4.14.1, which
  // supports SDK <= 35: compileSdk 36 with targetSdk 35 was an unexplained
  // split.
  ext.Autoskeleton = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 35
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Autoskeleton[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.autoskeleton"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    // Real defect found while getting the Phase 4 harness to run end-to-end (task 4.1
    // prerequisite): with no explicit targetSdkVersion, AGP defaults the library's test
    // manifest's targetSdkVersion to compileSdkVersion, which is inherited via
    // getExtOrDefault from whichever example app's root ext values happen to be on the
    // classpath (examples/bare-rn sets compileSdkVersion=37). Robolectric 4.14.1 (pinned
    // below) supports SDK <= 35 and throws `targetSdkVersion=37 > maxSdkVersion=35` at
    // runner construction time — this is a genuine environment mismatch, not a test bug.
    // Pinning targetSdkVersion here only affects this library's own test manifest merge;
    // it has no effect on a consuming app's own targetSdkVersion.
    targetSdkVersion 35
    // task 0.4: instrumented androidTest module needs its own runner.
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // task 0.4 / plan.md §7.2a: Robolectric does not run a real layout pass, so the
  // sensor traversal tests set frames explicitly with view.layout(l,t,r,b). This
  // flag only controls resource loading, not layout — kept on because Robolectric
  // needs it to resolve @layout/@style resources some fixtures may reference.
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // task 0.4: JUnit + Robolectric — traversal/coordinate algebra, no device
  // (plan.md §7.2a). Fast, runs on every PR.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.14.1"
  // Replaces a hand-written ReactApplicationContext subclass whose nineteen
  // overrides tracked one RN version's class surface and broke on 0.83-0.86.
  // A mock adapts to whatever the installed version declares.
  testImplementation "org.mockito:mockito-core:5.14.2"

  // task 0.4: instrumented androidTest — radius-ladder R2 raster-probe validation
  // on a real emulator/device (plan.md §7.2b); Robolectric shadows Canvas/Bitmap
  // so R2 cannot be validated there.
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  // Real defect found while getting the Phase 4 instrumented harness to run
  // end-to-end (task 4.3 prerequisite): the group id was "androidx.test.runner",
  // which does not exist on Google's Maven — the `runner` artifact is published
  // under the "androidx.test" group (verified against
  // dl.google.com/dl/android/maven2/androidx/test/group-index.xml).
  androidTestImplementation "androidx.test:runner:1.6.2"
}
