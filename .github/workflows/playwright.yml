name: Playwright (web + SSR layout tests)

# plan.md §7.3: pin the Playwright version AND run inside the matching
# `mcr.microsoft.com/playwright` image, so the font stack and rasterizer are
# identical between CI and whatever a developer gets locally from the same image.
# The container tag below MUST be bumped in lockstep with `@playwright/test` in
# package.json — a drifted tag silently reintroduces the machine-variance problem
# this pinning exists to remove.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
